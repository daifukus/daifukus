goe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7s">Every rep, remembered. Each session scored against your</text><text x="26" y="189" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7799999999999999s">own baseline, and a coach that cites the study behind</text><text x="26" y="208" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.86s">every recommendation — so you can check it.</text><g class="pop" style="animation-delay:0.95s"><rect x="26" y="239" width="41" height="20" rx="10" fill="rgba(78,134,240,0.08)" stroke="rgba(78,134,240,0.2)"/><text x="46.3" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#4E86F0" text-anchor="middle">Sets</text></g><g class="pop" style="animation-delay:1.02s"><rect x="73.6" y="239" width="47" height="20" rx="10" fill="rgba(78,134,240,0.08)" stroke="rgba(78,134,240,0.2)"/><text x="97.1" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#4E86F0" text-anchor="middle">Score</text></g><g class="pop" style="animation-delay:1.0899999999999999s"><rect x="127.6" y="239" width="105" height="20" rx="10" fill="rgba(78,134,240,0.08)" stroke="rgba(78,134,240,0.2)"/><text x="179.9" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#4E86F0" text-anchor="middle">Strength Index</text></g><g class="pop" style="animation-delay:1.16s"><rect x="239.2" y="239" width="73" height="20" rx="10" fill="rgba(78,134,240,0.08)" stroke="rgba(78,134,240,0.2)"/><text x="275.5" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#4E86F0" text-anchor="middle">On-Device</text></g><line x1="26" y1="315" x2="326" y2="315" stroke="rgba(78,134,240,0.45)" stroke-dasharray="3 3" class="wipe" style="animation-delay:.6s"/><text x="332" y="319" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" letter-spacing="1.2" class="rise" style="animation-delay:1.5s">BASELINE</text><rect x="26" y="337" width="14" height="30" fill="rgba(78,134,240,0.4)" class="grow" style="animation-delay:0.70s"/><rect x="51" y="323" width="14" height="44" fill="rgba(78,134,240,0.4)" class="grow" style="animation-delay:0.76s"/><rect x="76" y="329" width="14" height="38" fill="rgba(78,134,240,0.4)" class="grow" style="animation-delay:0.82s"/><rect x="101" y="311" width="14" height="56" fill="#4E86F0" class="grow" style="animation-delay:0.88s"/><rect x="126" y="305" width="14" height="62" fill="#4E86F0" class="grow" style="animation-delay:0.94s"/><rect x="151" y="317" width="14" height="50" fill="rgba(78,134,240,0.4)" class="grow" style="animation-delay:1.00s"/><rect x="176" y="296" width="14" height="71" fill="#4E86F0" class="grow" style="animation-delay:1.06s"/><rect x="201" y="301" width="14" height="66" fill="#4E86F0" class="grow" style="animation-delay:1.12s"/><rect x="226" y="289" width="14" height="78" fill="#4E86F0" class="grow" style="animation-delay:1.18s"/><rect x="251" y="309" width="14" height="58" fill="#4E86F0" class="grow" style="animation-delay:1.24s"/><rect x="276" y="283" width="14" height="84" fill="#4E86F0" class="grow" style="animation-delay:1.30s"/><rect x="301" y="293" width="14" height="74" fill="#4E86F0" class="grow" style="animation-delay:1.36s"/><text x="422" y="301" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6b7280" letter-spacing="1.6" class="rise" style="animation-delay:1.6s">SESSION</text><text x="422" y="329" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#4E86F0" font-weight="700" class="pop" style="animation-delay:1.75s">+14%</text><text x="422" y="351" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" class="rise" style="animation-delay:1.9s">above your normal</text><line x1="26" y1="396" x2="578" y2="396" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="26" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#4E86F0" letter-spacing="0.4" class="rise" style="animation-delay:1.9s">mule.dfklabs.com</text><text x="578" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="2" text-anchor="end" class="rise" style="animation-delay:2.0s">DFK LABS</text><g clip-path="url(#c-mule)"><rect x="-230" y="0" width="205" height="436" fill="url(#s-mule)" class="sheen"/></g><rect x="0.5" y="0.5" width="603" height="435" fill="none" stroke="rgba(255,255,255,0.1)"/>
