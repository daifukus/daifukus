<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 436"
     width="604" height="436" role="img" aria-label="PANELTIR — UI KIT, REACT · TS, LIVE. The admin-panel kit behind every DFK board. It owns structure and behaviour and never colour: each project hands it a palette, and that is the whole customisation. paneltir.dfklabs.com">
  <title>PANELTIR — UI KIT</title>
  <style>
  .rise,.pop,.wipe,.grow,.draw{animation-fill-mode:both}
  .rise{opacity:0;animation:rise .62s cubic-bezier(.16,1,.3,1) forwards}
  .pop{opacity:0;transform-box:fill-box;transform-origin:center;
       animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  .wipe{transform-box:fill-box;transform-origin:left center;
        animation:wipe .9s cubic-bezier(.16,1,.3,1) forwards}
  .grow{transform-box:fill-box;transform-origin:bottom center;
        animation:grow .55s cubic-bezier(.16,1,.3,1) forwards}
  .draw{animation:draw 1.8s cubic-bezier(.16,1,.3,1) forwards}
  .beat{transform-box:fill-box;transform-origin:center;
        animation:beat 2.4s ease-in-out infinite}
  .halo{transform-box:fill-box;transform-origin:center;
        animation:halo 2.4s ease-out infinite}
  .sheen{animation:sheen 9s cubic-bezier(.5,0,.2,1) 1.6s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}
                  to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.82)}
                 62%{opacity:1;transform:scale(1.05)}
                 100%{opacity:1;transform:scale(1)}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.28}}
  @keyframes halo{0%{transform:scale(1);opacity:.55}
                  70%,100%{transform:scale(2.7);opacity:0}}
  @keyframes sheen{0%{transform:translateX(-38%)}
                   34%,100%{transform:translateX(150%)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;opacity:1!important;transform:none!important;
      stroke-dashoffset:0!important}
  }

  .travel{animation:travel 9s cubic-bezier(.5,0,.2,1) 1.6s infinite}
  @keyframes travel{0%{transform:none}22%{transform:translate(96px,20px)}48%{transform:translate(192px,0)}72%{transform:translate(288px,20px)}96%,100%{transform:none}}</style>
  <defs>
    <linearGradient id="g-paneltir" x1="0" y1="0" x2="1" y2="1">
      <stop offset="35%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1A0711"/>
    </linearGradient>
    <linearGradient id="r-paneltir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCEE0A"/>
      <stop offset="100%" stop-color="#FCEE0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-paneltir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCEE0A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FCEE0A" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FCEE0A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c-paneltir"><rect width="604" height="436"/></clipPath>
  </defs>
  <rect width="604" height="436" fill="url(#g-paneltir)"/><rect x="0" y="0" width="604" height="2" fill="url(#r-paneltir)" class="wipe" style="animation-delay:.15s"/><g class="rise" style="animation-delay:0.5s"><rect x="26" y="40" width="54" height="20" fill="none" stroke="rgba(252,238,10,0.25)"/><text x="52.9" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#FCEE0A" letter-spacing="0.6" text-anchor="middle">UI KIT</text></g><text x="91.8" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="1.2" class="rise" style="animation-delay:0.58s">REACT · TS</text><g class="rise" style="animation-delay:0.66s"><circle cx="515" cy="50" r="3.5" fill="#FCEE0A" class="beat"/><circle cx="515" cy="50" r="3.5" fill="none" stroke="#FCEE0A" stroke-width="1.2" class="halo"/><text x="531" y="54" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#FCEE0A" letter-spacing="1.4">LIVE</text></g><g class="pop" style="animation-delay:0.3s"><rect x="26" y="78" width="52" height="52" rx="9" fill="#FCEE0A"/><g transform="translate(35.36,87.36) scale(0.33280000000000004)"><path d="M26 28v44M50 28v30M74 28v38" fill="none" stroke="#1A0711" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="94" y="112" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="27" fill="#ffffff" font-weight="700" letter-spacing="6" class="rise" style="animation-delay:0.42s">PANELTIR</text><rect x="96" y="124" width="26" height="3" rx="1.5" fill="#FCEE0A" class="wipe" style="animation-delay:.62s"/><text x="26" y="170" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7s">The admin-panel kit behind every DFK board. It owns</text><text x="26" y="189" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7799999999999999s">structure and behaviour and never colour: each project</text><text x="26" y="208" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.86s">hands it a palette, and that is the whole customisation.</text><g class="pop" style="animation-delay:0.95s"><rect x="26" y="239" width="47" height="20" rx="10" fill="rgba(252,238,10,0.08)" stroke="rgba(252,238,10,0.2)"/><text x="49.5" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FCEE0A" text-anchor="middle">Board</text></g><g class="pop" style="animation-delay:1.02s"><rect x="80.0" y="239" width="92" height="20" rx="10" fill="rgba(252,238,10,0.08)" stroke="rgba(252,238,10,0.2)"/><text x="125.9" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FCEE0A" text-anchor="middle">Pointer drag</text></g><g class="pop" style="animation-delay:1.0899999999999999s"><rect x="178.8" y="239" width="60" height="20" rx="10" fill="rgba(252,238,10,0.08)" stroke="rgba(252,238,10,0.2)"/><text x="208.70000000000002" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FCEE0A" text-anchor="middle">Theming</text></g><g class="rise" style="animation-delay:0.7s"><rect x="26" y="295" width="84" height="72" fill="rgba(252,238,10,0.04)" stroke="rgba(252,238,10,0.16)"/><text x="30" y="289" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" letter-spacing="1.4">IDEAS</text></g><rect x="34" y="305" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.00s"/><rect x="34" y="325" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.05s"/><g class="rise" style="animation-delay:0.7799999999999999s"><rect x="122" y="295" width="84" height="72" fill="rgba(252,238,10,0.04)" stroke="rgba(252,238,10,0.16)"/><text x="126" y="289" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" letter-spacing="1.4">NEXT</text></g><rect x="130" y="305" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.08s"/><rect x="130" y="325" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.13s"/><g class="rise" style="animation-delay:0.86s"><rect x="218" y="295" width="84" height="72" fill="rgba(252,238,10,0.04)" stroke="rgba(252,238,10,0.16)"/><text x="222" y="289" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" letter-spacing="1.4">DOING</text></g><rect x="226" y="305" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.16s"/><g class="rise" style="animation-delay:0.94s"><rect x="314" y="295" width="84" height="72" fill="rgba(252,238,10,0.04)" stroke="rgba(252,238,10,0.16)"/><text x="318" y="289" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" letter-spacing="1.4">DONE</text></g><rect x="322" y="305" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.24s"/><rect x="322" y="325" width="68" height="13" fill="rgba(252,238,10,0.13)" class="rise" style="animation-delay:1.29s"/><rect x="34" y="305" width="68" height="13" fill="#FCEE0A" opacity="0.92" class="travel"/><text x="424" y="309" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6b7280" letter-spacing="1.4" class="rise" style="animation-delay:1.6s">POINTER EVENTS</text><text x="424" y="331" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" class="rise" style="animation-delay:1.72s">drag that works</text><text x="424" y="349" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" class="rise" style="animation-delay:1.84s">on iOS touch</text><line x1="26" y1="396" x2="578" y2="396" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="26" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FCEE0A" letter-spacing="0.4" class="rise" style="animation-delay:1.9s">paneltir.dfklabs.com</text><text x="578" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="2" text-anchor="end" class="rise" style="animation-delay:2.0s">DFK LABS</text><g clip-path="url(#c-paneltir)"><rect x="-230" y="0" width="205" height="436" fill="url(#s-paneltir)" class="sheen"/></g><rect x="0.5" y="0.5" width="603" height="435" fill="none" stroke="rgba(255,255,255,0.1)"/>
</svg>
