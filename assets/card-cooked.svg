<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 436"
     width="604" height="436" role="img" aria-label="COOKED — SCREEN TIME, iOS, IN DEV. Feed time turned into the distance your thumb scrolled — about 1.1 m a minute — and Doomie, who goes from fresh to cooked as you pass your limit. Nothing leaves the phone. dfklabs.com">
  <title>COOKED — SCREEN TIME</title>
  <style>
  .rise,.pop,.wipe,.grow,.draw{animation-fill-mode:both}
  .rise{opacity:0;animation:rise .62s cubic-bezier(.16,1,.3,1) forwards}
  .pop{opacity:0;transform-box:fill-box;transform-origin:center;
       animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  .wipe{transform-box:fill-box;transform-origin:left center;
        animation:wipe .9s cubic-bezier(.16,1,.3,1) forwards}
  .grow{transform-box:fill-box;transform-origin:bottom center;
        animation:grow .55s cubic-bezier(.16,1,.3,1) forwards}
  .draw{animation:draw 1.8s cubic-bezier(.16,1,.3,1) forwards}
  .beat{transform-box:fill-box;transform-origin:center;
        animation:beat 2.4s ease-in-out infinite}
  .halo{transform-box:fill-box;transform-origin:center;
        animation:halo 2.4s ease-out infinite}
  .sheen{animation:sheen 9s cubic-bezier(.5,0,.2,1) 1.6s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}
                  to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.82)}
                 62%{opacity:1;transform:scale(1.05)}
                 100%{opacity:1;transform:scale(1)}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.28}}
  @keyframes halo{0%{transform:scale(1);opacity:.55}
                  70%,100%{transform:scale(2.7);opacity:0}}
  @keyframes sheen{0%{transform:translateX(-38%)}
                   34%,100%{transform:translateX(150%)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;opacity:1!important;transform:none!important;
      stroke-dashoffset:0!important}
  }
</style>
  <defs>
    <linearGradient id="g-cooked" x1="0" y1="0" x2="1" y2="1">
      <stop offset="35%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#24120A"/>
    </linearGradient>
    <linearGradient id="r-cooked" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FF7A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-cooked" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7A3D" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF7A3D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c-cooked"><rect width="604" height="436"/></clipPath>
  </defs>
  <rect width="604" height="436" fill="url(#g-cooked)"/><rect x="0" y="0" width="604" height="2" fill="url(#r-cooked)" class="wipe" style="animation-delay:.15s"/><g class="rise" style="animation-delay:0.5s"><rect x="26" y="40" width="85" height="20" fill="none" stroke="rgba(255,122,61,0.25)"/><text x="68.65" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#FF7A3D" letter-spacing="0.6" text-anchor="middle">SCREEN TIME</text></g><text x="123.3" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="1.2" class="rise" style="animation-delay:0.58s">iOS</text><g class="rise" style="animation-delay:0.66s"><circle cx="517.6" cy="50" r="3.5" fill="#FF7A3D" class="beat"/><circle cx="517.6" cy="50" r="3.5" fill="none" stroke="#FF7A3D" stroke-width="1.2" class="halo"/><text x="533.6" y="54" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#FF7A3D" letter-spacing="1.4">IN DEV</text></g><g class="pop" style="animation-delay:0.3s"><clipPath id="clip-logo-cooked-jpg"><rect x="26" y="78" width="52" height="52" rx="9"/></clipPath><image x="26" y="78" width="52" height="52" clip-path="url(#clip-logo-cooked-jpg)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/><rect x="26" y="78" width="52" height="52" rx="9" fill="none" stroke="rgba(255,255,255,0.14)"/></g><text x="94" y="112" font-family="'Fredoka','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#ffffff" font-weight="700" letter-spacing="6" class="rise" style="animation-delay:0.42s">COOKED</text><rect x="96" y="124" width="26" height="3" rx="1.5" fill="#FF7A3D" class="wipe" style="animation-delay:.62s"/><text x="26" y="170" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7s">Feed time turned into the distance your thumb scrolled —</text><text x="26" y="189" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7799999999999999s">about 1.1 m a minute — and Doomie, who goes from fresh to</text><text x="26" y="208" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.86s">cooked as you pass your limit. Nothing leaves the phone.</text><g class="pop" style="animation-delay:0.95s"><rect x="26" y="239" width="85" height="20" rx="10" fill="rgba(255,122,61,0.08)" stroke="rgba(255,122,61,0.2)"/><text x="68.7" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FF7A3D" text-anchor="middle">Screen Time</text></g><g class="pop" style="animation-delay:1.02s"><rect x="118.4" y="239" width="60" height="20" rx="10" fill="rgba(255,122,61,0.08)" stroke="rgba(255,122,61,0.2)"/><text x="148.3" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FF7A3D" text-anchor="middle">Shields</text></g><g class="pop" style="animation-delay:1.0899999999999999s"><rect x="185.20000000000002" y="239" width="53" height="20" rx="10" fill="rgba(255,122,61,0.08)" stroke="rgba(255,122,61,0.2)"/><text x="211.90000000000003" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FF7A3D" text-anchor="middle">Doomie</text></g><g class="pop" style="animation-delay:1.16s"><rect x="245.60000000000002" y="239" width="85" height="20" rx="10" fill="rgba(255,122,61,0.08)" stroke="rgba(255,122,61,0.2)"/><text x="288.3" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FF7A3D" text-anchor="middle">6 languages</text></g><text x="26" y="281" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6b7280" letter-spacing="1.4" class="rise" style="animation-delay:0.6s">TODAY · LIMIT 150 m</text><rect x="26" y="301" width="360" height="14" rx="7" fill="rgba(255,122,61,0.1)" stroke="rgba(255,122,61,0.2)"/><rect x="26" y="301" width="236" height="14" rx="7" fill="#FF7A3D" class="wipe" style="animation-delay:.8s;animation-duration:1.6s"/><line x1="176" y1="295" x2="176" y2="321" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/><text x="176.0" y="333" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" text-anchor="middle" class="rise" style="animation-delay:1.2s">50%</text><line x1="266" y1="295" x2="266" y2="321" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/><text x="266.0" y="333" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" text-anchor="middle" class="rise" style="animation-delay:1.2s">80%</text><line x1="326" y1="295" x2="326" y2="321" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2"/><text x="326.0" y="333" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#6b7280" text-anchor="middle" class="rise" style="animation-delay:1.2s">100%</text><text x="101.0" y="357" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="rgba(255,122,61,0.38)" letter-spacing="1.4" text-anchor="middle" class="rise" style="animation-delay:1.5s">FRESH</text><text x="251.0" y="357" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#FF7A3D" font-weight="700" letter-spacing="1.4" text-anchor="middle" class="rise" style="animation-delay:1.6s">HOOKED</text><text x="356.0" y="357" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="rgba(255,122,61,0.38)" letter-spacing="1.4" text-anchor="middle" class="rise" style="animation-delay:1.7s">COOKED</text><text x="416" y="301" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6b7280" letter-spacing="1.6" class="rise" style="animation-delay:1.6s">SCROLLED</text><text x="416" y="329" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#FF7A3D" font-weight="700" class="pop" style="animation-delay:1.75s">118 m</text><text x="416" y="351" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" class="rise" style="animation-delay:1.9s">≈ 0.36 × Eiffel Tower</text><line x1="26" y1="396" x2="578" y2="396" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="26" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF7A3D" letter-spacing="0.4" class="rise" style="animation-delay:1.9s">dfklabs.com</text><text x="578" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="2" text-anchor="end" class="rise" style="animation-delay:2.0s">DFK LABS</text><g clip-path="url(#c-cooked)"><rect x="-230" y="0" width="205" height="436" fill="url(#s-cooked)" class="sheen"/></g><rect x="0.5" y="0.5" width="603" height="435" fill="none" stroke="rgba(255,255,255,0.1)"/>
</svg>
