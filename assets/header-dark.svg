<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-label="DFK Labs — iOS Engineering Unit. Native intelligence, fluid reality.">
  <title>DFK Labs — iOS Engineering Unit</title>
  <defs>
    <linearGradient id="scan-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fe0c5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fe0c5" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#3fe0c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vign-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="card-dark"><rect x="0" y="0" width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="wipe-word-dark">
      <rect x="150" y="70" width="0" height="120">
        <animate attributeName="width" values="0;760" dur="1.1s" begin="0.35s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      </rect>
    </clipPath>
    <clipPath id="wipe-sub-dark">
      <rect x="150" y="196" width="0" height="40">
        <animate attributeName="width" values="0;620" dur="1.4s" begin="1.05s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.33 1 0.68 1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card-dark)">
    <rect width="1200" height="300" fill="#050505"/>
    <rect width="1200" height="300" fill="url(#vign-dark)"/>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
      <rect width="1200" height="300" fill="url(#grid-dark)"/>
    </g>

    <path d="M 26 60 L 26 26 L 60 26" fill="none" stroke="#3fe0c5" stroke-width="2" stroke-linecap="square" stroke-dasharray="68" stroke-dashoffset="68" opacity="0.75"><animate attributeName="stroke-dashoffset" values="68;0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M 1174 60 L 1174 26 L 1140 26" fill="none" stroke="#3fe0c5" stroke-width="2" stroke-linecap="square" stroke-dasharray="68" stroke-dashoffset="68" opacity="0.75"><animate attributeName="stroke-dashoffset" values="68;0" dur="0.8s" begin="0.22s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M 26 240 L 26 274 L 60 274" fill="none" stroke="#3fe0c5" stroke-width="2" stroke-linecap="square" stroke-dasharray="68" stroke-dashoffset="68" opacity="0.75"><animate attributeName="stroke-dashoffset" values="68;0" dur="0.8s" begin="0.34s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>
    <path d="M 1174 240 L 1174 274 L 1140 274" fill="none" stroke="#3fe0c5" stroke-width="2" stroke-linecap="square" stroke-dasharray="68" stroke-dashoffset="68" opacity="0.75"><animate attributeName="stroke-dashoffset" values="68;0" dur="0.8s" begin="0.46s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/></path>

    <!-- the mark: a block sitting behind an outlined box, opening on a slow loop -->
    <g transform="translate(64,104)">
      <rect x="6" y="6" width="56" height="56" rx="7" fill="#2563eb" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0,0; 5,5; 0,0" keyTimes="0;0.5;1" dur="4.5s"
                          begin="1.2s" repeatCount="indefinite" calcMode="spline"
                          keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </rect>
      <rect x="0" y="0" width="56" height="56" rx="7" fill="#050505" stroke="#f4f4f5"
            stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.35s" fill="freeze"/>
      </rect>
      <rect x="20" y="20" width="16" height="16" rx="3" fill="#3fe0c5" opacity="0">
        <animate attributeName="opacity" values="0;1;0.35;1" keyTimes="0;0.25;0.6;1"
                 dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- wordmark -->
    <g clip-path="url(#wipe-word-dark)">
      <text x="150" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="62" font-weight="700"
            letter-spacing="6" fill="#f4f4f5">DFK LABS</text>
    </g>
    <rect x="152" y="172" width="0" height="3" rx="1.5" fill="#3fe0c5">
      <animate attributeName="width" values="0;432" dur="0.9s" begin="0.95s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </rect>

    <!-- subtitle, revealed like it is being typed -->
    <g clip-path="url(#wipe-sub-dark)">
      <text x="152" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="5.5"
            fill="#9aa4b2">iOS ENGINEERING UNIT · NATIVE INTELLIGENCE</text>
    </g>
    <rect x="152" y="199" width="9" height="16" fill="#3fe0c5" opacity="0">
      <animate attributeName="x" values="152;618" dur="1.4s" begin="1.05s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.33 1 0.68 1"/>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.4;0.5;1" dur="1.1s"
               begin="2.5s" repeatCount="indefinite"/>
    </rect>

    <g><rect x="152" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="2.00s" repeatCount="indefinite"/></rect><text x="152" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">LABS</text></g>
    <g><rect x="248" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="2.34s" repeatCount="indefinite"/></rect><text x="248" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">BIRDIO</text></g>
    <g><rect x="344" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="2.68s" repeatCount="indefinite"/></rect><text x="344" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">QUAKE</text></g>
    <g><rect x="440" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="3.02s" repeatCount="indefinite"/></rect><text x="440" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">MULE</text></g>
    <g><rect x="536" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="3.36s" repeatCount="indefinite"/></rect><text x="536" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">STUDIO</text></g>
    <g><rect x="632" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="3.70s" repeatCount="indefinite"/></rect><text x="632" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">PANELTIR</text></g>
    <g><rect x="728" y="246" width="72" height="3" rx="1.5" fill="#3fe0c5" opacity="0.16"><animate attributeName="opacity" values="0.16;0.16;1;0.16" keyTimes="0;0.12;0.22;1" dur="5.6s" begin="4.04s" repeatCount="indefinite"/></rect><text x="728" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.6" fill="#5b6472">RISU</text></g>

    <!-- status, top right -->
    <g transform="translate(1158,52)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
      <text x="-16" y="5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12"
            letter-spacing="2.4" fill="#9aa4b2">SHIPPING</text>
      <circle cx="0" cy="0" r="4.5" fill="#3fe0c5"/>
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#3fe0c5" stroke-width="1.5">
        <animate attributeName="r" values="4.5;15" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="1158" y="266" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
          font-style="italic" fill="#5b6472" opacity="0">Engineered in Silence.
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="2.2s" fill="freeze"/>
    </text>

    <!-- the sweep -->
    <rect x="-190" y="0" width="190" height="300" fill="url(#scan-dark)">
      <animate attributeName="x" values="-190;1200" dur="8s" begin="1.8s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none"
          stroke="#ffffff" stroke-opacity="0.13"/>
  </g>
</svg>
