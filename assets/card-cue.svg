<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 436"
     width="604" height="436" role="img" aria-label="CUE — SPEECH NOTES, iOS · watchOS, SOON. Speaker notes your audience never sees. The watch screen stays black, as if it were off; a double tap shows your next point for a moment, and then it is gone again. dfklabs.com/cue">
  <title>CUE — SPEECH NOTES</title>
  <style>
  .rise,.pop,.wipe,.grow,.draw{animation-fill-mode:both}
  .rise{opacity:0;animation:rise .62s cubic-bezier(.16,1,.3,1) forwards}
  .pop{opacity:0;transform-box:fill-box;transform-origin:center;
       animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  .wipe{transform-box:fill-box;transform-origin:left center;
        animation:wipe .9s cubic-bezier(.16,1,.3,1) forwards}
  .grow{transform-box:fill-box;transform-origin:bottom center;
        animation:grow .55s cubic-bezier(.16,1,.3,1) forwards}
  .draw{animation:draw 1.8s cubic-bezier(.16,1,.3,1) forwards}
  .beat{transform-box:fill-box;transform-origin:center;
        animation:beat 2.4s ease-in-out infinite}
  .halo{transform-box:fill-box;transform-origin:center;
        animation:halo 2.4s ease-out infinite}
  .sheen{animation:sheen 9s cubic-bezier(.5,0,.2,1) 1.6s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}
                  to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.82)}
                 62%{opacity:1;transform:scale(1.05)}
                 100%{opacity:1;transform:scale(1)}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.28}}
  @keyframes halo{0%{transform:scale(1);opacity:.55}
                  70%,100%{transform:scale(2.7);opacity:0}}
  @keyframes sheen{0%{transform:translateX(-38%)}
                   34%,100%{transform:translateX(150%)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;opacity:1!important;transform:none!important;
      stroke-dashoffset:0!important}
  }

  .flash{animation:flash 5s ease-in-out 1.4s infinite}
  @keyframes flash{0%{opacity:0}8%,48%{opacity:1}58%,100%{opacity:0}}</style>
  <defs>
    <linearGradient id="g-cue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="35%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1F1505"/>
    </linearGradient>
    <linearGradient id="r-cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB23F"/>
      <stop offset="100%" stop-color="#FFB23F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB23F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB23F" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFB23F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c-cue"><rect width="604" height="436"/></clipPath>
  </defs>
  <rect width="604" height="436" fill="url(#g-cue)"/><rect x="0" y="0" width="604" height="2" fill="url(#r-cue)" class="wipe" style="animation-delay:.15s"/><g class="rise" style="animation-delay:0.5s"><rect x="26" y="40" width="92" height="20" fill="none" stroke="rgba(255,178,63,0.25)"/><text x="71.8" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#FFB23F" letter-spacing="0.6" text-anchor="middle">SPEECH NOTES</text></g><text x="129.6" y="53.5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="1.2" class="rise" style="animation-delay:0.58s">iOS · watchOS</text><g class="rise" style="animation-delay:0.66s"><circle cx="532.4" cy="50" r="3.5" fill="#FFB23F" class="beat"/><circle cx="532.4" cy="50" r="3.5" fill="none" stroke="#FFB23F" stroke-width="1.2" class="halo"/><text x="548.4" y="54" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#FFB23F" letter-spacing="1.4">SOON</text></g><g class="pop" style="animation-delay:0.3s"><clipPath id="clip-logo-cue-jpg"><rect x="26" y="78" width="52" height="52" rx="9"/></clipPath><image x="26" y="78" width="52" height="52" clip-path="url(#clip-logo-cue-jpg)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/><rect x="26" y="78" width="52" height="52" rx="9" fill="none" stroke="rgba(255,255,255,0.14)"/></g><text x="94" y="112" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#ffffff" font-weight="700" letter-spacing="6" class="rise" style="animation-delay:0.42s">CUE</text><rect x="96" y="124" width="26" height="3" rx="1.5" fill="#FFB23F" class="wipe" style="animation-delay:.62s"/><text x="26" y="170" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7s">Speaker notes your audience never sees. The watch screen</text><text x="26" y="189" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.7799999999999999s">stays black, as if it were off; a double tap shows your</text><text x="26" y="208" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b94a2" class="rise" style="animation-delay:0.86s">next point for a moment, and then it is gone again.</text><g class="pop" style="animation-delay:0.95s"><rect x="26" y="239" width="79" height="20" rx="10" fill="rgba(255,178,63,0.08)" stroke="rgba(255,178,63,0.2)"/><text x="65.5" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FFB23F" text-anchor="middle">Double tap</text></g><g class="pop" style="animation-delay:1.02s"><rect x="112.0" y="239" width="92" height="20" rx="10" fill="rgba(255,178,63,0.08)" stroke="rgba(255,178,63,0.2)"/><text x="157.9" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FFB23F" text-anchor="middle">Black screen</text></g><g class="pop" style="animation-delay:1.0899999999999999s"><rect x="210.8" y="239" width="85" height="20" rx="10" fill="rgba(255,178,63,0.08)" stroke="rgba(255,178,63,0.2)"/><text x="253.5" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FFB23F" text-anchor="middle">6 languages</text></g><g class="pop" style="animation-delay:1.16s"><rect x="303.20000000000005" y="239" width="73" height="20" rx="10" fill="rgba(255,178,63,0.08)" stroke="rgba(255,178,63,0.2)"/><text x="339.50000000000006" y="252.5" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#FFB23F" text-anchor="middle">On-Device</text></g><g class="rise" style="animation-delay:0.7s"><rect x="44" y="277" width="40" height="8" rx="3" fill="rgba(255,255,255,0.06)"/><rect x="44" y="359" width="40" height="8" rx="3" fill="rgba(255,255,255,0.06)"/><rect x="26" y="283" width="76" height="78" rx="18" fill="#000000" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><text x="64" y="379" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" fill="#6b7280" letter-spacing="1.4" text-anchor="middle">BEFORE</text></g><g class="rise" style="animation-delay:1.1s"><circle cx="144" cy="322" r="5" fill="#FFB23F" class="beat"/><circle cx="144" cy="322" r="5" fill="none" stroke="#FFB23F" stroke-width="1.2" class="halo"/><text x="144" y="345" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" fill="#FFB23F" letter-spacing="1.2" text-anchor="middle">DOUBLE TAP</text></g><g class="rise" style="animation-delay:0.85s"><rect x="204" y="277" width="40" height="8" rx="3" fill="rgba(255,255,255,0.06)"/><rect x="204" y="359" width="40" height="8" rx="3" fill="rgba(255,255,255,0.06)"/><rect x="186" y="283" width="76" height="78" rx="18" fill="#000000" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><g class="flash"><text x="196" y="311" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" font-weight="700">Open with</text><text x="196" y="326" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" font-weight="700">the first-</text><text x="196" y="341" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" font-weight="700">customer story</text></g><text x="224" y="379" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" fill="#6b7280" letter-spacing="1.4" text-anchor="middle">AFTER</text></g><text x="296" y="301" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6b7280" letter-spacing="1.6" class="rise" style="animation-delay:1.5s">ON SCREEN</text><text x="296" y="329" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#FFB23F" font-weight="700" class="pop" style="animation-delay:1.65s">1–6 s</text><text x="296" y="351" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" class="rise" style="animation-delay:1.8s">then black again</text><line x1="26" y1="396" x2="578" y2="396" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="26" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FFB23F" letter-spacing="0.4" class="rise" style="animation-delay:1.9s">dfklabs.com/cue</text><text x="578" y="416" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" letter-spacing="2" text-anchor="end" class="rise" style="animation-delay:2.0s">DFK LABS</text><g clip-path="url(#c-cue)"><rect x="-230" y="0" width="205" height="436" fill="url(#s-cue)" class="sheen"/></g><rect x="0.5" y="0.5" width="603" height="435" fill="none" stroke="rgba(255,255,255,0.1)"/>
</svg>
